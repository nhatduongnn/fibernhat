[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fibernhat"
version = "0.1.0"
description = "BAM-first fiber-seq (nanopore m6A) QC, fiberplots, aggregate plots and per-read m6A quintile metaprofiles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nhat Duong" }]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "pysam>=0.21",
  "statsmodels>=0.13",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
all = ["pytest>=7"]

[project.scripts]
fibernhat = "fibernhat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fibernhat = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
